AllCops:
  NewCops: enable
  TargetRubyVersion: 3.1

Layout/LineLength:
  Max: 300

Layout/EndOfLine:
  Enabled: false

Metrics/MethodLength:
  Max: 150

Metrics/BlockLength:
  Enabled: false

Metrics/BlockNesting:
  Max: 4

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/ParameterLists:
  Max: 9
  CountKeywordArgs: false

Metrics/ClassLength:
  Exclude:
    - 'test/**/*'

Style/MethodCallWithoutArgsParentheses:
  Enabled: false

Style/RescueModifier:
  Enabled: false
